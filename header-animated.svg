<!-- header-animated.svg -->
<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font: bold 40px 'Courier New', monospace;
      fill: #00ffcc;
    }
    .subtitle {
      font: 20px 'Courier New', monospace;
      fill: white;
    }
    .blink {
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    svg {
      background-color: #0d1117;
    }
  </style>

  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="50%" y="80" text-anchor="middle" class="title">
    Matthieu – Web3 & Solidity Developer
  </text>
  <text x="50%" y="130" text-anchor="middle" class="subtitle">
    building vaults, securing chains, writing clean smart contracts
  </text>
  <text x="50%" y="170" text-anchor="middle" class="subtitle blink">_</text>
</svg>
