
<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font: bold 40px 'Courier New', monospace;
      fill: #f5025b;
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    .subtitle {
      font: 20px 'Courier New', monospace;
      fill: white;
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    .subtitle-1 {
      animation-delay: 2s;
    }

    .subtitle-2 {
      animation-delay: 3s;
    }

    .cursor {
      animation: blink 1s step-start infinite;
      fill: white;
    }

    .logos {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
      animation-delay: 4s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>

  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="500" y="80" text-anchor="middle" class="title">
    Jaqensv - Web3
  </text>
  <text x="500" y="130" text-anchor="middle" class="subtitle subtitle-1">
    smart contracts development &amp; security
  </text>
  <text x="500" y="170" text-anchor="middle" class="subtitle subtitle-2 cursor">
    _
  </text>

  <!-- Logos -->
  <g class="logos">
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/c/c-original.svg" x="360" y="190" height="30" width="30"/>
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg" x="400" y="190" height="30" width="30"/>
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/solidity/solidity-original.svg" x="440" y="190" height="30" width="30"/>
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" x="480" y="190" height="30" width="30"/>
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/rust/rust-plain.svg" x="520" y="190" height="30" width="30"/>
  </g>
</svg>
