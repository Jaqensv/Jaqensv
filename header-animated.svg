<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Matthieu De Langhe — Header</title>
  <desc id="desc">Titre et sous-titre avec fondu en entrée.</desc>

  <style>
    /* Fallback: visible par défaut */
    .title, .subtitle { opacity: 1; }

    .title {
      font: bold 40px 'Courier New', monospace;
      fill: #f5025b;
      animation: fadeIn 1s ease-in-out forwards;
      animation-delay: 0.2s;
      text-rendering: geometricPrecision;
    }

    .subtitle {
      font: 20px 'Courier New', monospace;
      fill: #ffffff;
      animation: fadeIn 1s ease-in-out forwards;
    }
    .subtitle-1 { animation-delay: 1.2s; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Respecte la préférence utilisateur (et évite des blocages éventuels) */
    @media (prefers-reduced-motion: reduce) {
      .title, .subtitle { animation: none; }
    }
  </style>

  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="500" y="110" text-anchor="middle" class="title">Matthieu De Langhe</text>
  <text x="500" y="160" text-anchor="middle" class="subtitle subtitle-1">software engineering</text>
</svg>
